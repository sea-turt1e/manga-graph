name: Neo4j AuraDB Keep-Alive (Safe)

on:
  schedule:
    - cron: '0 9 * * *' # 毎日午前9時（UTC）
  workflow_dispatch:

# GITHUB_TOKEN には何の権限も与えない（チェックアウトも不要）
permissions: {}

concurrency:
  group: neo4j-keepalive
  cancel-in-progress: true

jobs:
  keepalive-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    # eMudhra CA issue (https://emudhra.we-have-a-problem.com/): patched system CA store
    - name: Update CA certificates
      run: |
        sudo apt-get update
        sudo apt-get install -y --only-upgrade ca-certificates

    - name: Setup Python
      # タグは書き換え可能なためコミット SHA で固定（v7.0.0）
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.15.1'

    - name: Install Neo4j driver
      # バージョンを固定して意図しないパッケージ更新を防ぐ
      run: pip install "pip>=26.2.2" "neo4j==5.14.1" "certifi>=2026.10.19"
    
    - name: Simple Keep-Alive
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USER }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        python << 'EOF'
        from neo4j import GraphDatabase
        import os
        import sys
        
        def simple_keep_alive():
            uri = os.getenv('NEO4J_URI')
            username = os.getenv('NEO4J_USERNAME')
            password = os.getenv('NEO4J_PASSWORD')
            
            if not all([uri, username, password]):
                print("❌ 環境変数が設定されていません")
                sys.exit(1)
            
            try:
                driver = GraphDatabase.driver(uri, auth=(username, password))
                
                with driver.session() as session:
                    # 最もシンプルなクエリでKeep-Alive
                    result = session.run("RETURN 'Neo4j AuraDB Keep-Alive OK' AS message, datetime() AS timestamp")
                    record = result.single()
                    
                    print("✅ Neo4j AuraDB Keep-Alive成功!")
                    print(f"📝 メッセージ: {record['message']}")
                    print(f"🕐 時刻: {record['timestamp']}")
                
                driver.close()
                print("✅ 接続を正常に終了しました")
                
            except Exception as e:
                print(f"❌ エラーが発生しました: {e}")
                sys.exit(1)
        
        simple_keep_alive()
        EOF
